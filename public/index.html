<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드뉴스 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0e0f0d; --panel:#171916; --panel2:#1f221e; --line:#2c302a; --text:#eef1ec; --muted:#9aa196;
  --accent:#5CF23D; --accent-ink:#0b0b0b; --warn:#ffb020; --bad:#ff5a4f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:hover{border-color:#4a5146}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:42px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:14px;background:#0b0c0a}
.brand{font-weight:900;letter-spacing:.02em;font-size:18px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--accent);border-color:#2f5a25}
.chip.no{color:var(--bad);border-color:#5a2a25}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto}
.item{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--panel)}
.item.on{background:var(--panel);border-color:var(--line)}
.item .t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-right:4px}
.badge.s-published{background:#173a12;color:var(--accent)}
.badge.s-error{background:#3a1512;color:var(--bad)}

main{padding:28px 36px 60px;max-width:1280px}
.steps{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--panel);color:var(--muted);font-size:14px}
.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:12px}
.step.done{color:var(--text)} .step.done b{background:#2f5a25;color:var(--accent)}
.step.now{color:var(--accent-ink);background:var(--accent);font-weight:700} .step.now b{background:rgba(0,0,0,.15)}
h1{font-size:26px;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}

.hero{text-align:center;padding:80px 20px}
.hero h1{font-size:32px}
.hero button{font-size:18px;padding:16px 28px;margin-top:22px}

.progress{max-width:640px}
.spinner{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.log{margin-top:14px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.log div:last-child{color:var(--text)}

.topics{display:grid;gap:10px}
.topic{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;cursor:pointer}
.topic:hover{border-color:#4a5146}
.topic.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.rank{font-size:22px;font-weight:900;color:var(--muted);text-align:center}
.topic.sel .rank{color:var(--accent)}
.topic h3{font-size:17px;font-weight:700}
.topic .hook{color:var(--accent);font-weight:600;margin:2px 0 6px}
.topic .src{font-size:13px;color:var(--muted)}
.topic .why{font-size:14px;margin-top:6px;color:#c9cec5}
.scores{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dots{letter-spacing:2px;color:var(--accent);font-size:13px}
.bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.bar .hint{margin-right:auto;color:var(--muted);font-size:14px}

.plan{display:grid;grid-template-columns:1fr;gap:14px}
.slide{display:grid;grid-template-columns:216px 1fr;gap:18px}
.thumb{width:216px;height:270px;border-radius:8px;overflow:hidden;background:#000;position:relative}
.thumb iframe,.thumb img{border:0;width:1080px;height:1350px;transform:scale(.2);transform-origin:0 0;pointer-events:none}
.thumb img{width:216px;height:270px;transform:none}
.fields{display:grid;gap:8px;align-content:start}
.fields label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.fields .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rows{display:grid;gap:6px}
.rows .r{display:grid;grid-template-columns:56px 1fr 1fr 90px;gap:6px}
.stype{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
details summary{font-size:12px;color:var(--muted);cursor:pointer}
.flow{font-size:15px;line-height:1.8}
.flow em{font-style:normal;color:var(--accent);font-weight:700}
.issues{font-size:14px;color:var(--warn)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.saved{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;display:none;max-width:80vw}
.result{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.result img{width:100%;border-radius:8px}
.warn{color:var(--warn);font-size:14px;margin-top:10px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px}.slide{grid-template-columns:1fr}.side{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">THE BLAB<small>카드뉴스 스튜디오</small></div>
    <div class="keys" id="keys"></div>
    <button class="primary" id="newBtn">＋ 트렌드 분석 시작</button>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hl = s => esc(s).replace(/==(.+?)==/gs, '<em>$1</em>').replace(/\n/g, ' ');
const api = async (url, opts = {}) => {
  const r = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 5000); };

const STAGE = {
  researching: '트렌드 분석 중', topics: '주제 선택', planning: '기획 중', plan: '기획 확인',
  confirmed: '컨펌 완료', producing: '제작·업로드 중', published: '게시 완료', error: '실패',
};
const STEP_OF = { researching: 0, error: 0, topics: 1, planning: 2, plan: 2, confirmed: 3, producing: 3, published: 4 };
let state = { project: null, selected: 0, keys: {} };

async function refreshList() {
  const list = await api('/api/projects');
  $('#list').innerHTML = list.map(p => `
    <div class="item ${state.project?.id === p.id ? 'on' : ''}" data-id="${p.id}">
      <div class="t">${esc(p.topic || '새 카드뉴스')}</div>
      <div class="m"><span class="badge s-${p.stage}">${STAGE[p.stage] || p.stage}</span>${p.id.slice(0, 10)}</div>
    </div>`).join('') || '<div class="m" style="color:var(--muted);font-size:13px">아직 만든 카드뉴스가 없습니다</div>';
  $('#list').querySelectorAll('.item').forEach(el => el.onclick = () => open(el.dataset.id));
}

async function open(id) {
  state.project = await api('/api/projects/' + id);
  const sel = state.project.candidates?.findIndex(c => c.topic === state.project.selected?.topic);
  state.selected = sel > 0 ? sel : 0;
  history.replaceState(null, '', '#' + id);
  render();
  refreshList();
}

function steps() {
  const now = state.project ? STEP_OF[state.project.stage] : 0;
  return `<div class="steps">${['트렌드 분석', '주제 선택', '기획 확인', '제작·업로드'].map((t, i) =>
    `<div class="step ${i < now ? 'done' : i === now ? 'now' : ''}"><b>${i < now ? '✓' : i + 1}</b>${t}</div>`).join('')}</div>`;
}

function render() {
  const p = state.project;
  if (!p) {
    $('#main').innerHTML = `<div class="hero">
      <h1>오늘 올릴 카드뉴스, 주제부터 찾아볼까요?</h1>
      <p class="sub"><b style="color:var(--accent)">＋ 트렌드 분석 시작</b> 버튼을 누르면 최근 기사와 인스타 반응을 읽고,<br>잘 터지면서 몰입의 방과 이어지는 주제 10개를 뽑아 드립니다. (3~6분)</p></div>`;
    return;
  }
  // API 키 없이 쓰는 중: 채팅 창의 Claude 가 요청을 받아 처리하는 동안 대기 화면
  if (p.request) {
    const title = { trends: '시장 트렌드를 읽는 중입니다', plan: `“${esc(p.selected?.topic)}” 기획 중입니다`, revise: '수정 요청을 반영하는 중입니다' }[p.request.type];
    $('#main').innerHTML = steps() + `<div class="card progress"><h1><span class="spinner"></span>${title}</h1>
      <p class="sub" style="margin:0">Claude 가 웹 검색으로 작업하고 있어요. 3~6분 걸리고, 끝나면 이 화면이 자동으로 바뀝니다.<br>
      <span style="color:var(--warn)">Claude 채팅 창이 켜져 있어야 진행됩니다.</span></p></div>`;
    watchRequest(p.id, p.updated);
    return;
  }
  const view = { researching: progressView, planning: progressView, producing: progressView, topics: topicsView, plan: planView, confirmed: planView, published: publishedView, error: errorView }[p.stage];
  $('#main').innerHTML = steps() + view(p);
  if (['researching', 'planning', 'producing'].includes(p.stage)) poll();
  if (['plan', 'confirmed'].includes(p.stage)) bindPlan();
}

// 채팅의 Claude 가 기획을 채우면 화면 갱신
async function watchRequest(id, updated) {
  clearTimeout(watchRequest.h);
  watchRequest.h = setTimeout(async () => {
    if (state.project?.id !== id) return;
    const p = await api('/api/projects/' + id).catch(() => null);
    if (p && p.updated !== updated) open(id); else watchRequest(id, updated);
  }, 4000);
}
setInterval(() => refreshList().catch(() => {}), 10000);

// ── 진행 중 ──
function progressView(p) {
  const title = { researching: '시장 트렌드를 읽는 중입니다', planning: '기획안을 쓰는 중입니다', producing: '제작해서 인스타에 올리는 중입니다' }[p.stage];
  const note = { researching: '보통 2~5분 걸립니다. 창을 닫아도 계속 진행됩니다.', planning: '근거 자료를 더 찾고, 7장 기획 후 편집자 검수까지 합니다. 2~4분.', producing: '배경 사진 생성 → 렌더 → 업로드. 3~6분. 끝나면 게시 링크가 나옵니다.' }[p.stage];
  return `<div class="card progress"><h1><span class="spinner"></span>${title}</h1><p class="sub" style="margin:0">${note}</p><div class="log" id="log"></div></div>`;
}
async function poll() {
  const id = state.project.id, jobId = state.project.job;
  clearTimeout(poll.h);
  const job = jobId ? await api('/api/jobs/' + jobId) : { status: 'unknown' };
  if (state.project?.id !== id) return;
  const log = $('#log');
  if (log) log.innerHTML = (job.log || []).map(l => `<div>· ${esc(l.m)}</div>`).join('');
  if (job.status === 'running') { poll.h = setTimeout(poll, 2500); return; }
  if (job.status === 'error') toast(job.error);
  if (job.status === 'unknown') toast('서버가 다시 시작되어 진행 상황을 잃었습니다. 다시 시도해 주세요.');
  await open(id);
}

// ── 주제 선택 ──
const dots = n => '●'.repeat(n) + '<span style="opacity:.25">' + '●'.repeat(5 - n) + '</span>';
function topicsView(p) {
  return `<h1>주제를 골라 주세요</h1><p class="sub">화제성과 몰입의 방 연관도를 함께 본 순위입니다. 하나를 고르면 7장 기획안을 만듭니다.</p>
  <div class="topics">${p.candidates.map((c, i) => `
    <div class="card topic ${i === state.selected ? 'sel' : ''}" data-i="${i}">
      <div class="rank">${i + 1}</div>
      <div><h3>${esc(c.topic)}</h3><div class="hook">“${esc(c.hook)}”</div>
        <div class="src"><a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(c.headline)}</a> · ${esc(c.source)} ${esc(c.date)}</div>
        <div class="why">${esc(c.why)}</div></div>
      <div class="scores">화제성 <span class="dots">${dots(c.viral)}</span><br>연관도 <span class="dots">${dots(c.product)}</span></div>
    </div>`).join('')}</div>
  <div class="bar"><span class="hint">선택: ${state.selected + 1}위 · ${esc(p.candidates[state.selected].topic)}</span>
    <button onclick="startTrends()">다시 분석</button><button class="primary" onclick="startPlan()">이 주제로 기획하기</button></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('.topic');
  if (t) { state.selected = Number(t.dataset.i); render(); }
});

// ── 기획 확인 ──
const FIELDS = {
  scover: [['title', '표지 문장 (숫자가 든 놀라운 사실, 2줄)', 2]],
  story: [['title', '문장 (한 장에 한 문장)', 3]],
  follow: [['title', '팔로우 문구', 2]],
  cover: [['title', '제목 (답을 숨긴 후킹)', 2], ['highlight', '초록 줄', 1]],
  punch: [['title', '제목', 3], ['body', '본문', 3], ['src', '출처', 1]],
  stat: [['kicker', '숫자 위 문구', 1], ['big', '큰 숫자', 1], ['title', '제목', 2], ['src', '출처', 1]],
  rank: [['title', '제목', 1]],
  product: [['title', '제목', 2], ['sub', '제품명', 1], ['caption', '하단 문구', 2]],
  cta: [['title', '제목', 2], ['body', '본문', 2]],
};
const NAMES = { scover: '표지', story: '본문', follow: '팔로우', cover: '표지', punch: '강조', stat: '숫자', rank: '순위', product: '제품', cta: '마무리' };
function flow(deck) {
  return deck.slides.map((s, i) => `${i + 1}. ${[s.kicker, s.big, s.title, s.highlight].filter(Boolean).map(hl).join(' ')}`).join('<br>');
}
function planView(p) {
  const d = p.deck, confirmed = p.stage === 'confirmed';
  const thumbs = d.slides.map((s, i) => `
    <div class="card slide" data-n="${i}">
      <div class="thumb"><iframe src="/api/projects/${p.id}/preview/${i}?v=${Date.now()}" loading="lazy"></iframe></div>
      <div class="fields"><div class="stype">${i + 1}장 · ${NAMES[s.type]}</div>
        ${FIELDS[s.type].map(([k, label, rows]) => `<label>${label}<textarea rows="${rows}" data-k="${k}">${esc(s[k] || '')}</textarea></label>`).join('')}
        ${s.type === 'rank' ? `<div class="rows">${s.rows.map((r, j) => `<div class="r">
            <input data-r="${j}" data-rk="mark" value="${esc(r.mark)}"><input data-r="${j}" data-rk="label" value="${esc(r.label)}">
            <input data-r="${j}" data-rk="note" value="${esc(r.note || '')}" placeholder="메모"><input data-r="${j}" data-rk="tone" value="${esc(r.tone || 'normal')}" title="bad / normal / best"></div>`).join('')}</div>` : ''}
        <details><summary>배경 사진 프롬프트</summary><textarea rows="3" data-k="bgPrompt">${esc(s.bgPrompt)}</textarea></details>
      </div></div>`).join('');
  return `<h1>${esc(d.topic)}</h1>
  <p class="sub">문구를 바로 고치면 왼쪽 미리보기에 반영됩니다. 배경 사진은 제작 단계에서 AI로 새로 만들어집니다. <span class="saved" id="saved"></span></p>
  <div class="side">
    <div class="card"><div class="stype" style="margin-bottom:8px">제목만 이어 읽기</div><div class="flow">${flow(d)}</div></div>
    <div class="card"><div class="stype" style="margin-bottom:8px">편집자 검수</div>
      <div class="issues">${p.review?.issues?.length ? p.review.issues.map(x => '· ' + esc(x)).join('<br>') : '<span style="color:var(--accent)">지적 사항 없음</span>'}</div>
      <div class="stype" style="margin:14px 0 8px">이렇게 다시 기획해 줘</div>
      <textarea id="feedback" rows="2" placeholder="예) 3장 근거를 수면 연구로 바꿔줘, 표지를 더 자극적으로"></textarea>
      <div style="text-align:right;margin-top:8px"><button onclick="revise()">수정 요청</button></div></div>
  </div>
  <div class="plan">${thumbs}
    <div class="card"><div class="stype" style="margin-bottom:8px">인스타 캡션</div><textarea id="caption" rows="9">${esc(d.caption)}</textarea></div>
  </div>
  <div class="bar"><span class="hint">${confirmed ? '컨펌 완료 — 제작을 누르면 theblab_official 에 바로 게시됩니다' : '내용을 확인하고 컨펌해 주세요'}</span>
    ${confirmed ? `<button class="primary" onclick="produce()">제작하고 인스타에 올리기</button>` : `<button class="primary" onclick="confirmPlan()">기획 컨펌</button>`}</div>`;
}
function bindPlan() {
  const p = state.project;
  const save = () => {
    clearTimeout(bindPlan.h);
    $('#saved').textContent = '저장 중…';
    bindPlan.h = setTimeout(async () => {
      try {
        const wasConfirmed = state.project.stage === 'confirmed';
        state.project = await api(`/api/projects/${p.id}/deck`, { method: 'PUT', body: { deck: p.deck } });
        $('#saved').textContent = '저장됨';
        document.querySelector('.flow').innerHTML = flow(p.deck);
        if (wasConfirmed) { render(); refreshList(); }
      } catch (e) { toast(e.message); }
    }, 700);
  };
  document.querySelectorAll('.slide').forEach(card => {
    const s = p.deck.slides[card.dataset.n];
    const reload = () => { const f = card.querySelector('iframe'); clearTimeout(f.h); f.h = setTimeout(() => f.src = f.src.replace(/v=\d+/, 'v=' + Date.now()), 900); };
    card.querySelectorAll('[data-k]').forEach(el => el.oninput = () => { s[el.dataset.k] = el.value; save(); reload(); });
    card.querySelectorAll('[data-r]').forEach(el => el.oninput = () => { s.rows[el.dataset.r][el.dataset.rk] = el.value; save(); reload(); });
  });
  $('#caption').oninput = e => { p.deck.caption = e.target.value; save(); };
}

// ── 게시 완료 / 실패 ──
function publishedView(p) {
  return `<h1>게시 완료</h1><p class="sub">${esc(p.deck.topic)}</p>
  <div class="card"><a href="${esc(p.permalink)}" target="_blank" rel="noopener" style="font-size:17px;font-weight:700">인스타그램에서 보기 →</a>
  ${p.imageWarnings?.length ? `<div class="warn">${p.imageWarnings.map(esc).join('<br>')}</div>` : ''}
  <div class="result">${(p.images || []).map(u => `<img src="/${u}?v=${Date.now()}">`).join('')}</div></div>`;
}
function errorView(p) {
  return `<h1>분석에 실패했습니다</h1><div class="card"><p class="warn" style="margin:0 0 14px">${esc(p.error)}</p><button class="primary" onclick="startTrends()">다시 분석</button></div>`;
}

// ── 버튼 동작 ──
async function run(fn) { try { const r = await fn(); state.project = r.project || r; render(); refreshList(); } catch (e) { toast(e.message); } }
const startTrends = () => run(async () => { const r = await api('/api/projects', { method: 'POST' }); history.replaceState(null, '', '#' + r.project.id); return r; });
const startPlan = () => run(() => api(`/api/projects/${state.project.id}/plan`, { method: 'POST', body: { index: state.selected } }));
const revise = () => run(() => api(`/api/projects/${state.project.id}/revise`, { method: 'POST', body: { feedback: $('#feedback').value } }));
const confirmPlan = () => run(() => api(`/api/projects/${state.project.id}/confirm`, { method: 'POST' }));
const produce = () => {
  if (!confirm('theblab_official 에 바로 게시됩니다. 진행할까요?')) return;
  run(() => api(`/api/projects/${state.project.id}/produce`, { method: 'POST' }));
};
$("#newBtn").onclick = startTrends;
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== state.project?.id) open(id).catch(e => toast(e.message)); });

(async () => {
  const { keys } = await api('/api/status');
  state.keys = keys;
  $('#keys').innerHTML = [['higgsfield', '힉스필드'], ['instagram', '인스타']]
    .map(([k, n]) => `<span class="chip ${keys[k] ? 'ok' : 'no'}" title="${keys[k] ? '연결됨' : '.env 에 키 없음'}">${keys[k] ? '●' : '○'} ${n}</span>`).join('');
  await refreshList();
  if (location.hash.length > 1) open(location.hash.slice(1)).catch(() => render()); else render();
})();
</script>
</body>
</html>
