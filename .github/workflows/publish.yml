# 매일 18:00 (KST) 검토 이슈가 취소되지 않았으면 theblab_official 에 게시
name: 카드뉴스 게시

on:
  # 사이트(server.js)로 직접 고르고 올리는 방식으로 바뀌어 자동 실행은 꺼 둠. 다시 켜려면 아래 두 줄 주석 해제
  # schedule:
  #   - cron: '0 9 * * *'   # UTC 09:00 = KST 18:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: cardnews

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 게시
        run: node publish-pending.js
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: 기록 커밋
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "카드뉴스 게시 기록" && git push)
