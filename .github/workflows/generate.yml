# 매일 15:00 (KST) 카드뉴스 생성 → 검토 이슈 생성. 18:00 publish.yml 이 게시한다
name: 카드뉴스 생성

on:
  schedule:
    - cron: '0 6 * * *'   # UTC 06:00 = KST 15:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: cardnews

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 한글·이모지 폰트 (Pretendard CDN 이 막혀도 깨지지 않게)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - run: npm ci

      - name: 리서치 → 카피 → 배경 → 렌더
        run: node generate.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome

      - name: 검토 이슈 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create 취소 --color B60205 --description "붙이면 18시 게시를 건너뜀" --force
          gh label create 게시완료 --color 0E8A16 --force
          DATE=$(jq -r .date data/pending.json)
          TOPIC=$(jq -r .topic data/pending.json)
          URL=$(gh issue create --title "[카드뉴스] $DATE $TOPIC" --body-file data/issue.md)
          jq --argjson n "${URL##*/}" '.issue = $n' data/pending.json > tmp.json && mv tmp.json data/pending.json

      - name: 결과 커밋
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add decks data out assets/bg
          git commit -m "카드뉴스 생성 $(jq -r .date data/pending.json)"
          git push
